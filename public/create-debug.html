<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nessuno Escluso - debug scrittura</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #f8f1df;
        color: #202638;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 820px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      label {
        display: block;
        margin: 20px 0 8px;
        font-weight: 700;
      }

      input,
      textarea {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #9ca3af;
        border-radius: 8px;
        background: white;
        color: #111827;
        font: inherit;
        padding: 12px 14px;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      .note {
        margin-top: 24px;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Debug scrittura</h1>
      <p>Questa pagina non carica React, Firebase, TanStack Router o font esterni.</p>

      <label for="title">Titolo</label>
      <input id="title" placeholder="Scrivi qui..." autocomplete="off" />

      <label for="description">Descrizione</label>
      <textarea id="description" placeholder="Scrivi anche qui..."></textarea>

      <p class="note">
        Se questa pagina non si blocca, il problema e' nel bundle dell'app. Se si blocca anche qui,
        il problema e' esterno all'app.
      </p>
    </main>
  </body>
</html>
